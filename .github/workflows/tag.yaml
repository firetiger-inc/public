name: Tag Release

on:
  push:
    branches: [main]

concurrency:
  group: tag-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          DATE=$(date -u +%Y.%-m.%-d)
          SHA=$(git rev-parse --short=7 "$GITHUB_SHA")
          # Prefix SHA with 'g' (git describe convention) so the prerelease
          # identifier is never purely numeric — SemVer 2.0 disallows leading
          # zeros in numeric identifiers, and 7-hex SHAs like 0873564 collide
          # with that rule.
          VERSION="${DATE}-g${SHA}"
          # Require the prerelease block to contain at least one letter or
          # hyphen so a purely-numeric identifier (which may have a leading
          # zero) cannot slip through.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-zA-Z.-]*[a-zA-Z-][0-9a-zA-Z.-]*)?$'; then
            echo "::error::Computed version '$VERSION' is not valid SemVer"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse --verify --quiet "refs/tags/${VERSION}"; then
            echo "Tag ${VERSION} already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}" "$GITHUB_SHA"
          git push origin "refs/tags/${VERSION}"

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Tagged \`${VERSION}\`"
            echo ""
            echo "Pin a module in terraform:"
            echo ""
            echo '```hcl'
            echo "module \"firetiger_cloudwatch_logs\" {"
            echo "  source = \"github.com/firetiger-inc/public//ingest/aws/cloudwatch/logs/terraform?ref=${VERSION}\""
            echo "}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
